# configs/grop_config.yaml

model:
  model_path: "checkpoints/sft_v3/epoch1"
  best_reward: 0
  start_step: 0
  dtype: "bfloat16"
  # attn_implementation: "flash_attention_2"
  attn_implementation: "sdpa"
  wandb_id: null

data:
  train_path: "data/MATH/sft.jsonl"
  valid_path: "data/MATH/validation.jsonl"
  prompt_path: "cs336_alignment/prompts/r1_zero.prompt"
  max_seq_length: 4096
  max_samples: 5000
  start_sample: 0

training:
  output_dir: "checkpoints/drgrpo_v3_5e-6"
  n_grpo_steps: 500
  learning_rate: 5.0e-6
  advantage_eps: 1.0e-6
  rollout_batch_size: 64
  group_size: 8
  sampling_temperature: 1.0
  repetition_penalty: 1.0
  sampling_min_tokens: 4
  sampling_max_tokens: 4096
  epochs_per_rollout_batch: 1
  # train_batch_size: 256
  save_steps: 50

  micro_batch_size: 1
  # gradient_accumulation_steps: 128
  gpu_memory_utilization: 0.4
  loss_type: "grpo_clip"
  clip_range: 0.2
  max_grad_norm: 1.0

  normalize_by_std: False

evaluation:
  eval_every_steps: 10
  num_examples_to_log: 4
  max_new_tokens: 4096

wandb:
  project: "CS336-Assignment5-Alignment"
  run_name: "drgrpo_v3"
  entity: null
