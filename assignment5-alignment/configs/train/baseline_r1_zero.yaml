# configs/drgrpo_config.yaml

model:
  model_path: "models/Qwen2.5-Math-1.5B"
  best_reward: 0
  start_step: 0
  dtype: "bfloat16"
  # attn_implementation: "flash_attention_2"
  attn_implementation: "sdpa"
  wandb_id: null

data:
  train_path: "data/currriculum/grpo_final_curriculum.jsonl"
  valid_path: "data/MATH/test_split.jsonl"
  prompt_path: "prompts/r1_zero.prompt"
  max_seq_length: 4096
  max_samples: 4800
  start_sample: 0

training:
  output_dir: "checkpoints/baseline_r1_zero"
  n_grpo_steps: 600
  learning_rate: 2.0e-6
  advantage_eps: 1.0e-6
  rollout_batch_size: 64
  group_size: 8
  sampling_temperature: 1.0
  repetition_penalty: 1.0
  sampling_min_tokens: 4
  sampling_max_tokens: 4096
  epochs_per_rollout_batch: 1
  # train_batch_size: 256
  save_steps: 50
  warmup_ratio: 0.1

  micro_batch_size: 1
  # gradient_accumulation_steps: 128
  gpu_memory_utilization: 0.25
  loss_type: "grpo_clip"
  clip_range: 0.2
  max_grad_norm: 1.0

  normalize_by_std: False

evaluation:
  eval_every_steps: 20
  num_examples_to_log: 16
  max_new_tokens: 3072

wandb:
  project: "CS336-Assignment5-Alignment"
  run_name: "baseline_r1_zero"
  entity: null
