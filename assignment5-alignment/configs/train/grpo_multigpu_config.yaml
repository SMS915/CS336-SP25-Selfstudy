# configs/train/grpo_multigpu_config.yaml
model:
  model_path: "checkpoints/sft/epoch0"
  best_reward: 0
  start_step: 0
  dtype: "bfloat16"
  attn_implementation: "sdpa"
  trust_remote_code: true
  wandb_id: null

runtime:
  device: "cuda"
  cuda_visible_devices: "0,1,2,3,4,5,6,7"
  hf_device_map: "auto"
  max_memory_gb_per_gpu: 20
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.15

data:
  train_path: "data/CoT/Bespoke-Stratos-17k-R1-tag.jsonl"
  valid_path: "data/MATH/test_split.jsonl"
  prompt_path: "prompts/r1_zero.prompt"
  max_seq_length: 4096
  max_samples: 5000
  start_sample: 0

training:
  output_dir: "checkpoints/grpo_multigpu"
  n_grpo_steps: 500
  warmup_ratio: 0.1
  learning_rate: 5.0e-6
  advantage_eps: 1.0e-6
  rollout_batch_size: 64
  inference_batch_size: 2
  group_size: 8
  sampling_temperature: 1.0
  repetition_penalty: 1.0
  sampling_min_tokens: 4
  sampling_max_tokens: 4096
  epochs_per_rollout_batch: 1
  save_steps: 50
  micro_batch_size: 1
  gradient_checkpointing: true
  loss_type: "grpo_clip"
  clip_range: 0.2
  max_grad_norm: 1.0
  normalize_by_std: true
  remove_length_norm: false
  length_panelty: true
  enforce_eager: true
  enable_prefix_caching: false
  stop_tokens: ["</answer>", "<|endoftext|>"]
  fixed_norm_length: null

evaluation:
  eval_every_steps: 10
  num_examples_to_log: 4
  max_new_tokens: 4096

wandb:
  project: "CS336-Assignment5-Alignment"
  run_name: "grpo_multigpu"
  entity: null
