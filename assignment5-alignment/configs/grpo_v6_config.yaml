# configs/grop_config.yaml

model:
  model_path: "checkpoints/grpo_v6_5e-6/checkpoint-step-450"
  best_reward: 0.6875
  start_step: 451
  dtype: "bfloat16"
  # attn_implementation: "flash_attention_2"
  attn_implementation: "sdpa"
  wandb_id: "wg24w1ep"

data:
  train_path: "data/MATH/sft.jsonl"
  valid_path: "data/MATH/validation.jsonl"
  prompt_path: "cs336_alignment/prompts/r1_zero.prompt"
  max_seq_length: 4096
  max_samples: 5000
  start_sample: 3609

training:
  output_dir: "checkpoints/grpo_v6_5e-6"
  n_grpo_steps: 500
  warmup_ratio: 0.1
  learning_rate: 5.0e-6
  advantage_eps: 1.0e-6
  rollout_batch_size: 64
  group_size: 8
  sampling_temperature: 1.0
  repetition_penalty: 1.0
  sampling_min_tokens: 4
  sampling_max_tokens: 4096
  epochs_per_rollout_batch: 1
  # train_batch_size: 256
  save_steps: 50

  micro_batch_size: 1
  # gradient_accumulation_steps: 128
  gpu_memory_utilization: 0.25
  loss_type: "grpo_clip"
  clip_range: 0.2
  max_grad_norm: 1.0

  normalize_by_std: True
  length_panelty: True

evaluation:
  eval_every_steps: 10
  num_examples_to_log: 4
  max_new_tokens: 4096

wandb:
  project: "CS336-Assignment5-Alignment"
  run_name: "grpo_v6"
  entity: null
