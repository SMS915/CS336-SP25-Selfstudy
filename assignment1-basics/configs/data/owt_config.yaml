# ==========================================
# 1. 基础与系统设置 (General & System)
# ==========================================
project_name: "CS336-TransformerLM-data_owt_cs_C4"
seed: 42
device: "cuda"
load_ckpt: False
save_ckpt: False
checkpoint_path: "checkpoints/"

# ==========================================
# 2. 数据设置 (Data Configuration)
# ==========================================
train_data_path: "data/owt_train.bin"         # 预处理好的OpenWebText 10GB子集训练数据
val_data_path: "data/c4/c4_validation.bin"    # 验证数据，C4 en 验证集
batch_size: 32
context_length: 512
token_dtype: "uint16"

# ==========================================
# 3. 模型架构设置 (Model Architecture)
# ==========================================
vocab_size: 50257
n_layers: 12
n_heads: 12
d_model: 768
d_ff: 2048
theta: 10000.0

# 以下为消融的可选实验参数
n_kv_heads: null

activation: "silu"
gated_ffn: True
gated_attn: False
Weight_Tying: True

post_norm: False
layer_norm: False
no_norm: False

pos_emb_type: 'rope'

bias: False

flash_attn: True

# ==========================================
# 4. 训练流程设置 (Training Loop)
# ==========================================
max_steps: 100000
warmup_steps: 1000
cycle_steps: 79000
accumulate_size: 4
grad_checkpointing: False

log_interval: 50
eval_interval: 500
eval_steps: 100
checkpoint_interval: 10000

disable_amp: False

# ==========================================
# 5. 优化器与调度器 (Optimizer & Scheduler)
# ==========================================
lr_schedule: 'cosine'
max_learning_rate: 1e-3
min_learning_rate: 1e-4
weight_decay: 0.1
max_grad_norm: 1.0

beta1: 0.9
beta2: 0.98
eps: 1e-9