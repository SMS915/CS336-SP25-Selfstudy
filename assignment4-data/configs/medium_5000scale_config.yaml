project_name: "CS336_Medium_Scale_2k"

paths:
  input_dir: "data/crawls/wet"
  base_output_dir: "data/medium_output_2k"

pipeline:
  resume: True # 断点续传
  
models:
  quality_classifier: "data/my_classifiers/quality_classifier.bin"
  toxic_path: "data/classifiers/jigsaw_fasttext_bigrams_hatespeech_final.bin"
  nsfw_path: "data/classifiers/jigsaw_fasttext_bigrams_nsfw_final.bin"
  lang_path: "data/classifiers/lid.176.bin"
  label_mapping:
    __label__low_quality: 'cc'
    __label__high_quality: 'wiki'

processing:
  # 留有余地，不要占满32核
  # cpu密集型任务开高点
  max_cpu_workers: 30

  # I/O 密集型或高内存消耗任务（去重验证、精确去重统计）
  max_io_workers: 20

  # 任务分配批次（减少 IPC 通信开销）
  chunk_size: 10

  num_shards: 30

  max_files_limit: 2000
  
  # 强制子进程重启频率
  worker_ttl: 50


filter:
  min_doc_length: 200        # 保持高质量过滤
  language:
    target: "en"
    min_score: 0.9           # 稍稍放宽一点点，或者保持 0.95
  safety:
    nsfw_threshold: 0.01     
    toxic_threshold: 0.01
  
deduplication:
  fuzzy:
    n_gram: 13
    num_hashes: 128
    bands: 20
    threshold: 0.8

  